# =============================================
# Stellar Jets - Backend Configuration
# =============================================
spring.application.name=stellar-jets-backend
server.port=8080

# ---- H2 (desarrollo local) ----
spring.datasource.url=jdbc:h2:mem:stellarjets;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Deshabilita el warning de open-in-view (no usamos lazy loading en vistas)
spring.jpa.open-in-view=false

# ---- Logging ----
logging.level.com.stellarjets=DEBUG
logging.level.org.springframework.web=INFO

# ---- CORS (ajustar en producción) ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- Paginación por defecto ----
app.pagination.default-page-size=10
